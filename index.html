<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Mnemonica Voice Trainer</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#12151c;color:#eef;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
h1{font-size:1.4rem;margin:8px 0 4px}p.sub{color:#99a;margin:0 0 18px;font-size:.9rem;text-align:center}
.screen{display:none;flex-direction:column;gap:12px;width:100%;max-width:420px;align-items:stretch}.screen.on{display:flex}
button{font:inherit;border:0;border-radius:14px;padding:16px;font-size:1.05rem;font-weight:600;cursor:pointer;color:#fff}
button small{font-weight:400;opacity:.85}.m1{background:#3b6fd8}.m2{background:#8a4fd8}.m3{background:#d8733b}.m4{background:#c0392b}.sec{background:#2a2f3a}.back{background:#2a2f3a}
.panel{background:#1c212b;border-radius:14px;padding:14px;display:grid;gap:10px}
select,input[type=range]{width:100%}select{font:inherit;padding:8px;border-radius:8px}
#card{font-size:3.4rem;font-weight:700;margin:14px 0 4px;min-height:4rem;text-align:center}.red{color:#f55}
.c{text-align:center}#status{color:#9ab;min-height:1.4em}#heard{color:#ccd;min-height:1.4em}#fb{font-size:1.3rem;min-height:1.8em}.ok{color:#5d5}.bad{color:#f66}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.row button{padding:11px 14px;font-size:.92rem}
.help{color:#778;font-size:.8rem;text-align:center}.badge{background:#fff3;border-radius:10px;padding:1px 8px;font-size:.85rem;margin-left:6px}
</style></head><body>
<h1>Mnemonica Voice Trainer</h1><p class="sub">Tap a mode, allow the microphone, and answer out loud.</p>

<div class="screen on" id="home">
<button class="m1" onclick="start('num')">Number → Card<br><small>It says "31", you say the card</small></button>
<button class="m2" onclick="start('card')">Card → Number<br><small>It says "Eight of Clubs", you say "33"</small></button>
<button class="m3" onclick="start('mix')">Mix &amp; Match<br><small>Numbers and cards, randomly mixed</small></button>
<button class="m4" onclick="show('missedMenu')">Missed Practice <span class="badge" id="mTotal">0</span><br><small>Only the ones you got wrong</small></button>
<div class="panel">
<label>Voice speed: <b id="rateVal"></b><input type="range" min="0.7" max="2" step="0.1" id="rate" oninput="setRate(this.value)"></label>
<label><input type="checkbox" id="hf" onchange="handsFree=this.checked;localStorage.hf=this.checked?1:0"> Hands-free (listens automatically; turn off to tap before each answer)</label>
<label><input type="checkbox" id="showText" checked onchange="showTxt=this.checked"> Show the question on screen</label>
</div>
<p class="help">Say "repeat", "skip", "answer", "missed" or "stop" at any time. Keep the screen on. Works best in Safari or Chrome.</p>
</div>

<div class="screen" id="missedMenu">
<button class="m1" onclick="start('mnum')">Missed Numbers <span class="badge" id="mNum">0</span><br><small>It says the number, you say the card</small></button>
<button class="m2" onclick="start('mcard')">Missed Cards <span class="badge" id="mCard">0</span><br><small>It says the card, you say the number</small></button>
<button class="m3" onclick="start('mall')">All Missed, Mixed <span class="badge" id="mAll">0</span><br><small>Both kinds of misses together</small></button>
<button class="sec" onclick="if(confirm('Clear all missed cards?')){missed={num:{},card:{}};save();updBadges()}">Clear missed list</button>
<button class="back" onclick="show('home')">Back</button>
</div>

<div class="screen" id="train">
<div class="c" id="modeName" style="color:#aab"></div>
<div id="card"></div><div class="c" id="status"></div><div class="c" id="heard"></div><div class="c" id="fb"></div><div class="c" id="score"></div><div class="c help" id="dbg"></div>
<button class="m1" style="padding:34px;font-size:1.4rem" onclick="if(running)listen(true)">🎤 Tap to answer</button>
<button class="m4" id="missBtn" onclick="goMissed()">Practice my missed ones <span class="badge" id="mNow">0</span></button>
<div class="row"><button class="sec" onclick="repeatQ()">Repeat</button><button class="sec" onclick="reveal()">Answer</button><button class="sec" onclick="skip()">Skip</button></div>
<button class="back" style="background:#c33" onclick="stopAll()">Stop</button>
</div>

<script>
const STACK="4C 2H 7D 3C 4H 6D AS 5H 9S 2S QH 3D QC 8H 6S 5S 9H KC 2D JH 3S 8S 6H TC 5D KD 2C 3H 8D 5C KS JD 8C TS KH JC 7S TH AD 4S 7H 4D AC 9C JS QD 7C QS TD 6C AH 9D".split(" ");
const RN={A:"Ace",2:"Two",3:"Three",4:"Four",5:"Five",6:"Six",7:"Seven",8:"Eight",9:"Nine",T:"Ten",J:"Jack",Q:"Queen",K:"King"};
const SN={C:"Clubs",H:"Hearts",D:"Diamonds",S:"Spades"},SY={C:"♣",H:"♥",D:"♦",S:"♠"};
const cname=c=>RN[c[0]]+" of "+SN[c[1]], sym=c=>(c[0]=="T"?"10":c[0])+SY[c[1]];
const $=i=>document.getElementById(i);
const MODES={num:"Number → Card",card:"Card → Number",mix:"Mix & Match",mnum:"Missed Numbers",mcard:"Missed Cards",mall:"All Missed, Mixed"};

/* ---------- parsing ---------- */
const NUMW={zero:0,one:1,won:1,two:2,to:2,too:2,three:3,four:4,for:4,five:5,six:6,seven:7,eight:8,ate:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50};
function parseNum(t){t=t.toLowerCase().replace(/-/g," ");const m=t.match(/\d+/);if(m)return +m[0];let s=0,f=false;for(const w of t.split(/\s+/))if(w in NUMW){s+=NUMW[w];f=true}return f?s:null}
const RW=[["A",/\b(ace|aces|ase|eighth)\b/],["K",/\b(king|kings)\b/],["Q",/\b(queen|queens)\b/],["J",/\b(jack|jacks)\b/],["T",/\b(ten|tens|10)\b/],["9",/\b(nine|9)\b/],["8",/\b(eight|ate|8)\b/],["7",/\b(seven|7)\b/],["6",/\b(six|6|sex)\b/],["5",/\b(five|5)\b/],["4",/\b(four|for|4)\b/],["3",/\b(three|tree|free|3)\b/],["2",/\b(two|to|too|deuce|2)\b/],["A",/\b(one|1)\b/]];
const SW=[["C",/(club|clover|clove|clue)/],["H",/(heart|hart)/],["D",/(diamond)/],["S",/(spade|spayed|spaid)/]];
function parseCard(t){t=t.toLowerCase();let s=null;for(const[k,r]of SW)if(r.test(t)){s=k;break}const u=t.replace(/\bof\b/g,"");let r=null;for(const[k,re]of RW)if(re.test(u)){r=k;break}return r&&s?r+s:null}

/* ---------- missed list (saved on phone) ---------- */
let missed=JSON.parse(localStorage.missed||'{"num":{},"card":{}}');
function save(){localStorage.missed=JSON.stringify(missed)}
const mList=t=>Object.keys(missed[t]).map(Number);
function updBadges(){const a=mList("num").length,b=mList("card").length;$("mNum").textContent=a;$("mCard").textContent=b;$("mAll").textContent=a+b;$("mTotal").textContent=a+b;$("mNow").textContent=a+b}
updBadges();

/* ---------- audio ---------- */
let rate=+(localStorage.rate||1.2);const player=new Audio();player.preservesPitch=true;
function setRate(v){rate=+v;localStorage.rate=v;$("rateVal").textContent=rate.toFixed(1)+"x"}
let playTok=0;
function playSeq(files,texts,cb){accepting=false;const my=++playTok;let i=0;const go=()=>step();
 const step=()=>{if(my!==playTok)return;if(i>=files.length){cb&&cb();return}const f=files[i],t=texts[i];i++;
  let done=false,tm=null;const fin=()=>{clearTimeout(tm);if(done||my!==playTok)return;done=true;step()};
  player.onended=fin;player.onerror=()=>{if(done)return;done=true;speakFallback(t,()=>{if(my===playTok)step()})};
  player.src="audio/"+f+".mp3";player.playbackRate=rate;tm=setTimeout(fin,4000);player.onplaying=()=>{clearTimeout(tm);const d=isFinite(player.duration)&&player.duration>0?player.duration:2.5;tm=setTimeout(fin,d/rate*1000+200)};player.play().catch(()=>{if(done)return;done=true;speakFallback(t,()=>{if(my===playTok)step()})})};
 stopRec().then(()=>{if(my===playTok)go()})}
function speakFallback(t,cb){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=rate;let d=false;const f=()=>{if(!d){d=true;cb()}};u.onend=f;u.onerror=f;speechSynthesis.speak(u)}
function stopAudio(){playTok++;player.pause();speechSynthesis.cancel()}

/* ---------- training ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let mode=null,q=null,running=false,right=0,total=0,showTxt=true,rec=null,recTok=0,last=null;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==id));updBadges()}
function pool(){ // returns list of [type,index]
 const all=t=>STACK.map((_,i)=>[t,i]);
 if(mode=="num")return all("num");if(mode=="card")return all("card");if(mode=="mix")return all("num").concat(all("card"));
 const n=mList("num").map(i=>["num",i]),c=mList("card").map(i=>["card",i]);
 return mode=="mnum"?n:mode=="mcard"?c:n.concat(c)}
function start(m){if(!SR){alert("Voice answers aren't supported in this browser. Try Safari or Chrome.");return}
 mode=m;if(!pool().length){alert("No missed ones here yet. Nice work.");return}
 running=true;right=total=0;startMic();$("modeName").textContent=MODES[m];show("train");upd();
 player.src="audio/correct.mp3";player.volume=0;player.play().catch(()=>{}).finally(()=>{player.pause();player.volume=1;next()})}
function goMissed(){if(!mList("num").length&&!mList("card").length){stopAudio();playSeq(["nomiss"],["No missed cards yet. Nice work!"],()=>{if(running)ask()});return}
 mode=mode=="num"&&mList("num").length?"mnum":mode=="card"&&mList("card").length?"mcard":"mall";
 $("modeName").textContent=MODES[mode];right=total=0;upd();next()}
function next(){if(!running)return;stopRec();const p=pool();
 if(!p.length){$("fb").innerHTML='<span class="ok">All missed ones cleared</span>';playSeq(["nomiss"],["No missed cards yet. Nice work!"],()=>stopAll(true));return}
 let pick;do{pick=p[Math.floor(Math.random()*p.length)]}while(p.length>1&&last&&pick[0]==last[0]&&pick[1]==last[1]);last=pick;
 q={type:pick[0],i:pick[1],card:STACK[pick[1]],num:pick[1]+1};$("fb").textContent="";$("heard").textContent="";ask()}
function ask(){if(!q||!running)return;stopRec();
 $("card").innerHTML=!showTxt?"?":q.type=="num"?"#"+q.num:`<span class="${"HD".includes(q.card[1])?"red":""}">${sym(q.card)}</span>`;
 $("status").textContent="Speaking…";
 q.type=="num"?playSeq(["n"+q.num],[String(q.num)],listen):playSeq(["c"+q.num],[cname(q.card)],listen)}
/* fresh recognizer per question; always wait for the old one to fully close before speaking or listening */
let accepting=false,listenTok=0,closing=null,fails=0,handsFree=localStorage.hf!=="0";
function dbg(m){const d=$("dbg");if(d)d.textContent=m}
function closeRec(){if(!rec)return Promise.resolve();if(closing)return closing;const r=rec;
 closing=new Promise(res=>{let ok=false;const f=()=>{if(ok)return;ok=true;rec=rec===r?null:rec;closing=null;res()};r.onend=f;r.onresult=null;r.onerror=null;try{r.stop()}catch(e){f()}setTimeout(()=>{try{r.abort()}catch(e){}f()},800)});return closing}
function stopRec(){accepting=false;listenTok++;return closeRec()}
function killMic(){running=false;stopRec()}
function startMic(){}
function listen(fromTap){if(!running)return;if(!handsFree&&!fromTap){$("status").textContent="Tap the big button and say your answer";return}if(fromTap)fails=0;const my=++listenTok;accepting=false;closeRec().then(()=>{if(my!==listenTok||!running)return;openRec(my)})}
function openRec(my){const r=new SR();rec=r;r.lang="en-US";r.continuous=false;r.interimResults=true;r.maxAlternatives=3;const t0=Date.now();
 r.onstart=()=>{dbg("mic on "+(Date.now()-t0)+"ms")};
 r.onaudiostart=()=>{fails=0;if(my===listenTok){accepting=true;$("status").textContent="Listening… 🎤"}};
 r.onresult=e=>{if(my!==listenTok||!accepting)return;const res=e.results[e.results.length-1];const alts=[...res].map(x=>x.transcript).filter(x=>x.trim());if(!alts.length)return;
  $("heard").textContent='Heard: "'+alts[0]+'"';if(isCommand(alts[0])||isRight(alts)||res.isFinal){accepting=false;listenTok++;const h=alts;closeRec().then(()=>handle(h))}};
 r.onerror=e=>{dbg("mic error: "+e.error);if(e.error=="not-allowed"||e.error=="service-not-allowed"){$("status").textContent="Microphone blocked. Allow mic access, and turn on Dictation in iPhone Settings.";running=false}};
 r.onend=()=>{if(rec===r)rec=null;if(my!==listenTok||!running)return;fails++;if(!handsFree||fails>4){accepting=false;$("status").textContent="Tap the big button and say your answer";dbg("mic paused, tap to answer");return}setTimeout(()=>{if(my===listenTok&&running)openRec(my)},300*fails)};
 $("status").textContent="Starting mic…";$("heard").textContent="";try{r.start()}catch(e){dbg("start failed");setTimeout(()=>{if(my===listenTok)openRec(my)},400)}}
function isCommand(t){return/\b(stop|quit|repeat|again|skip|missed|mist|answer|give up)\b/i.test(t)}
function isRight(alts){return alts.some(a=>q.type=="num"?parseCard(a)==q.card:parseNum(a)==q.num)}
function answerClip(){return q.type=="num"?["c"+q.num,cname(q.card)]:["n"+q.num,String(q.num)]}
function handle(alts){const t=alts[0].toLowerCase();$("heard").textContent='Heard: "'+alts[0]+'"';
 if(/\b(stop|quit)\b/.test(t))return stopAll();if(/\b(repeat|again)\b/.test(t))return ask();if(/\bskip\b/.test(t))return next();
 if(/\b(missed|mist|wrong ones)\b/.test(t))return goMissed();if(/\b(answer|don'?t know|give up)\b/.test(t))return reveal();
 const ok=alts.some(a=>q.type=="num"?parseCard(a)==q.card:parseNum(a)==q.num);total++;
 if(ok){right++;if(mode[0]=="m"&&mode!="mix"){delete missed[q.type][q.i];save()}
  $("fb").innerHTML='<span class="ok">✓ Correct</span>';upd();playSeq(["correct"],["Correct!"],next)}
 else{missed[q.type][q.i]=1;save();const[a,at]=answerClip();
  $("fb").innerHTML='<span class="bad">✗ '+(q.type=="num"?sym(q.card):"#"+q.num)+'</span>';upd();playSeq(["no",a],["No. It's",at],next)}}
function reveal(){if(!q)return;stopRec();missed[q.type][q.i]=1;save();updBadges();const[a,at]=answerClip();
 $("fb").innerHTML='<span class="bad">'+(q.type=="num"?sym(q.card):"#"+q.num)+'</span>';playSeq(["its",a],["The answer is",at],next)}
function skip(){next()}function repeatQ(){ask()}
function upd(){$("score").textContent=`Score: ${right} / ${total}`+(total?` (${Math.round(100*right/total)}%)`:"");updBadges()}
function stopAll(silent){killMic();stopAudio();show("home");if(!silent)playSeq(["over"],["Session over."])}
$("hf").checked=handsFree;$("rate").value=rate;setRate(rate);
</script></body></html>
